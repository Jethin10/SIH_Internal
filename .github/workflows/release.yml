name: Build downloads
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: npm run setup
      - run: npm test
      - run: npm run test:agent
      - run: npm run release
      - run: npm --prefix extension run verify:release
      - uses: actions/upload-artifact@v4
        with:
          name: strawhats-downloads
          path: dist/*
          if-no-files-found: error
