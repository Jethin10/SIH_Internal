name: Demo verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install pinned Chromium with extension support
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:provider:harness
      - run: npm run evaluate
      - run: npm run release
      - run: npm run verify:release
      - run: npm run lint:firefox
      - name: Verify Firefox runtime on macOS
        if: runner.os == 'macOS'
        run: npm run test:firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-evidence-${{ matrix.os }}
          path: extension/artifacts/
  team-hub:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: strawhats-team-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: strawhats-team-hub/package-lock.json
      - run: npm ci
      - run: npm run build
